server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /var/www/webd-explorer-8088;
    index index.html;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    sub_filter_once on;

    location / {
        try_files $uri $uri/ /index.html;
        sub_filter '</body>' '<script src="/nav.js" defer></script></body>';
    }

    location /pool-proxy/daniuda/ {
        set $pool_daniuda https://pool.webdollarminingpool.com:8443;
        proxy_pass $pool_daniuda/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host pool.webdollarminingpool.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pool-proxy/daniuda/top {
        proxy_pass http://daniuda.ddns.net:8080/top;
        proxy_http_version 1.1;
        proxy_set_header Host daniuda.ddns.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pool-proxy/spyclub/ {
        set $pool_spyclub https://webdollarspyclubpool.com:8443;
        proxy_pass $pool_spyclub/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host webdollarspyclubpool.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pool-proxy/spyclub/top {
        set $pool_spyclub_top https://node.spyclub.ro:8080;
        proxy_pass $pool_spyclub_top/top;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /pool-proxy/timi/miners {
        set $pool_timi https://pool.timi.ro;
        proxy_pass $pool_timi/pools/miners;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /pool-proxy/timi/stats {
        set $pool_timi_s https://pool.timi.ro;
        proxy_pass $pool_timi_s/pools/stats;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /pool-proxy/timi/top {
        set $pool_timi_t https://pool.timi.ro;
        proxy_pass $pool_timi_t/top;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location /api/visit {
        proxy_pass http://127.0.0.1:8089/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wdexperience/ {
        root /var/www/webd-explorer-8088/;
        try_files $uri $uri/ /wdexperience/index.html;
        sub_filter '</body>' '<script src="/nav.js" defer></script></body>';
    }

    location /webd-staking/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding '';
        sub_filter '</body>' '<script src="/nav.js" defer></script></body>';
    }

    location /webd-checkout/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding '';
        sub_filter '</body>' '<script src="/nav.js" defer></script></body>';
    }
}
